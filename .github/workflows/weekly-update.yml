name: EconBoard 自动周更

on:
  schedule:
    - cron: "0 0 * * 1" # 每周一 08:00（北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: econboard-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取候选并合并已审核条目
        run: python scripts/weekly_update.py

      - name: 校验 data.js
        run: |
          node --check data.js
          node -e "global.window={};require('./data.js');const d=window.ECONBOARD_DATA;if(!Array.isArray(d.entries)||!d.entries.length)process.exit(1);console.log('entries:',d.entries.length)"

      - name: 提交周更结果
        run: |
          if git diff --quiet; then
            echo "本周无文件变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js review/candidates.json review/weekly-report.md
          git commit -m "chore: weekly EconBoard update"
          git push

      - name: 可选触发 Netlify 部署
        if: ${{ secrets.NETLIFY_BUILD_HOOK != '' }}
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: curl --fail --silent --show-error -X POST "$NETLIFY_BUILD_HOOK"
